name: Preview build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build Cloudflare preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:dry
